# Configuration de l'outillage Python.
# Le code vit dans api/, les tests dans tests/ (structure imposée par AGENTS.md §4).

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["api"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI : Depends() en valeur par défaut d'argument
